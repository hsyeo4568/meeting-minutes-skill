# meeting-minutes — config template
# Copy to config.yaml and fill. config.yaml is gitignored (personal/private data).
# The engine (references/engine/, SKILL.md) reads these values; it contains ZERO proper nouns.
# Every {{placeholder}} the engine emits MUST have a key here. See references/engine/CONTRACT.md.

identity:
  me: "<YOUR NAME>"              # {{me}} — the "I"/"나" speaker label in minutes
  org: "<YOUR ORG>"             # {{org}} — your organization short name

project:
  name: "<PROJECT DISPLAY NAME>" # {{project_name}}
  slug: "<project-slug>"         # {{project_slug}} — used in vault filenames/paths
  profile: "profiles/_template"  # path to active profile dir; null = skip domain/contact cross-checks

paths:
  vault: "<ABS PATH TO CANONICAL STORE ROOT>"       # {{vault_path}} — notes vault / docs folder / wiki root
  work_folder: "<ABS PATH TO MEETING SOURCE DIR>"   # {{work_folder}} — raw recordings/xlsx live here
  vault_meetings_subpath: "projects/<slug>/meetings" # {{vault_meetings_subpath}}
  # topics_moc: "topics/_MOC.md"                     # optional — phase 6.5 topic sync registry; omit to skip the phase

# Category x deliverable matrix. THIS IS CONFIG — every org meets differently.
# Keys are category ids; values are deliverable flags. gmail: true|false|optional.
# context_lookback = 직전 회의 얕은-스캔 개수 상한(prior-meeting shallow-scan cap; 전문 재독 아님).
# 시간창("1~2주") 대신 개수 cap — 데일리는 매일 열려 시간창이 폭증. 미해소 이슈는 cap 초과해도 추적.
# body_mode = 본문 구성 방식 (engine writing-principles §11). chronological(default)=발생 순 안건 나열 /
# axis=논의 축으로 재분류·재배치. 짧은 운영회의는 chronological, 심화·다자 논의는 axis.
categories:
  daily:    { detail_md: true,  share_md: true,  canvas: false, gmail: optional, vault: true, context_lookback: 3, body_mode: chronological }
  regular:  { detail_md: false, share_md: false, canvas: true,  gmail: true,     vault: true, context_lookback: 3, body_mode: chronological }
  workshop: { detail_md: false, share_md: false, canvas: true,  gmail: optional, vault: true, context_lookback: 2, body_mode: axis }

# Meeting materials comprehension (pipeline phase 1.5). Omit the whole block to skip the phase
# (the engine then falls back to plain structured extraction of attached slides).
# Handler chains are LITERAL tool/skill names for YOUR client — try in order, first available wins,
# a missing one is not an error. Engine text only names capabilities; this file names the tools.
materials:
  scan_folder: true      # folder input manifests every file, not just the transcript
  max_files: 12          # over the cap: show the list, ask which materials matter
  deep_read: ask         # auto | ask | off — rendered-page vision read for layout-borne meaning
  handlers:
    pptx: [<deck-distiller-skill>, python-pptx]
    pdf:  [<pdf-skill>, fitz]
    xlsx: [pandas]
    docx: [markitdown]

channels:
  slack_workspace_id: "<TXXXXXXXX>"  # {{slack_workspace_id}}
  slack_channel_id: "<CXXXXXXXX>"    # {{slack_channel_id}} — minutes channel
  slack_user_id: "<UXXXXXXXX>"       # {{slack_user_id}} — your DM target for review canvases
  slack_url_base: "https://<workspace>.slack.com"  # {{slack_url_base}}
  slack_bot_dm_id: ""                # {{slack_bot_dm_id}} — optional, bot DM channel
  # Per-artifact publish traits (nested values; the flat keys above are Slack connection ids).
  # editable: false = the channel cannot be updated in place, so re-publishing leaves an orphan.
  # After a source edit, mm_run mints a BLOCKING manual item for every non-editable artifact
  # already published. Omit an entry to accept the built-in default shown here.
  # readback: how `mm_run verify` compares what came back against what was sent.
  #   exact    = byte-faithful (after newline/BOM canon) — channels that store what they are given
  #   semantic = every sent line must be PRESENT after stripping the renderer's own formatting
  # Use semantic wherever the channel rewrites markup. Measured: a Slack canvas turns `-` bullets
  # into `*` and wraps dates as `![](slack_date:…)`; a Gmail plaintext body comes back hard-wrapped
  # near 78 columns, splitting one sent line into two. Exact comparison fails there on every run.
  # Semantic still catches truncation, dropped sections, an empty body and the wrong document.
  # The mode is frozen into the manifest at approve time (a later edit cannot downgrade a run).
  canvas:   { editable: false, readback: semantic }
  gmail:    { editable: true,  readback: semantic }
  vault:    { editable: true,  readback: exact }
  share_md: { editable: true,  readback: exact }

# Publish-protocol runtime (scripts/mm_run.py). Run state lives beside the work MD — never
# in the vault, so an in-flight run cannot pollute the canonical store or its search index.
runtime:
  state_dir: ".mm"       # state dir created next to the work MD; add it to .gitignore + search-index ignores
  lease_ttl_min: 30      # publish-lock lifetime. Expired lease = reclaimable; live foreign lease = exit 5
  retention_days: 90     # `mm_run gc` prunes snapshot/rendered/readback of terminal runs older than this
                         # (manifest.json + runs.jsonl are always kept)

# Tool availability. auto = detect at runtime; on/off = force. Missing tool -> file fallback (never fail).
tools:
  slack_mcp: auto
  gmail_mcp: auto
  qmd: auto
  ontology: auto

locale:
  # language/business_style = 본문 *문체* 지침. 산출물 헤더 문자열은 한국어 기본 — headers 맵으로 오버라이드.
  language: ko                       # {{language}}
  business_style: korean-gaejosik    # {{business_style}} — korean-gaejosik | plain | english
  headers: {}   # optional: override output header strings, e.g. {"이전 회의 연계 맥락": "Prior Meeting Context", "핵심 논의": "Key Discussion"}

# Vault frontmatter schema (field names the engine writes). Adjust to your vault contract.
# NOTE: slack_canvas_id is only meaningful if you use Slack canvases — remove it (and any
# other field you don't track) from the list; the engine writes only what is listed here.
vault_frontmatter:
  required: [date, type, category, chair, attendees_present, attendees_absent,
             attachments, recording, slack_canvas_id, issues_discussed,
             decisions, action_items, description, projects, tags]

# Ontology IRI namespace (only used if tools.ontology is available)
ontology:
  namespace: "<https://your.vault/ontology#>"
